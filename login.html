
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Harini Hospitals | Marketing Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="login-page">
        <section class="login-card">
            <h1>✚ Harini Hospitals</h1>
            <h2>Marketing Team Login</h2>
            <p class="muted">Sign in with your registered account.</p>

            <div class="tabs">
                <button type="button" id="emailTab" class="tab active">
                    Email Login
                </button>
                <button type="button" id="phoneTab" class="tab">
                    Mobile Login
                </button>
            </div>

            <form id="emailForm">
                <label for="email">Registered Email</label>
                <input id="email" type="email" autocomplete="username"
                       placeholder="name@example.com" required>

                <label for="password">Password</label>
                <input id="password" type="password"
                       autocomplete="current-password"
                       placeholder="Enter your password" required>

                <button type="submit" class="primary">Login</button>
                <button type="button" class="text-button" id="resetButton">
                    Forgot Password?
                </button>
            </form>

            <form id="phoneForm" hidden>
                <label for="phone">Mobile Number</label>
                <input id="phone" type="tel" autocomplete="tel"
                       placeholder="+919876543210" required>
                <p class="hint">Include country code, for example +91.</p>

                <div id="recaptcha-container"></div>
                <button type="submit" class="primary" id="sendOtp">
                    Send SMS OTP
                </button>

                <div id="otpSection" hidden>
                    <label for="otp">Verification Code</label>
                    <input id="otp" type="text" inputmode="numeric"
                           autocomplete="one-time-code"
                           placeholder="Enter 6-digit OTP" maxlength="6">
                    <button type="button" class="primary" id="verifyOtp">
                        Verify and Login
                    </button>
                </div>
            </form>

            <p id="message" role="status" aria-live="polite"></p>
            <p><a href="index.html">Back to Home</a></p>
        </section>
    </main>

    <script type="module" src="js/login.js"></script>
</body>
</html>
