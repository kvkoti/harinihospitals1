
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Harini Hospitals | Team Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="login-page">
        <section class="login-card">
            <h1>✚ Harini Hospitals</h1>
            <h2>My Marketing Dashboard</h2>
            <p id="welcome">Checking your account...</p>

            <section id="profile" hidden>
                <div class="profile-icon">👤</div>
                <p><strong>Name:</strong> <span id="memberName"></span></p>
                <p><strong>Role:</strong> <span id="memberRole"></span></p>
                <p><strong>Area:</strong> <span id="memberArea"></span></p>
                <p><strong>Email:</strong> <span id="memberEmail"></span></p>
                <p><strong>Mobile:</strong> <span id="memberPhone"></span></p>
            </section>

            <p id="dashboardMessage" role="status"></p>
            <button class="primary" id="logoutButton" type="button">
                Logout
            </button>
        </section>
    </main>

    <script type="module" src="js/dashboard.js"></script>
</body>
</html>
